spring.application.name=accommodation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/accommodation
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin@123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.context-path=/api
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springframework.security=DEBUG

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

jwt.secret=${JWT_SECRET:test-secret-key-for-unit-tests-only-32-bytes-min}
jwt.expiration=${JWT_EXPIRATION:3600000}

stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
